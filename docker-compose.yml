services:
  algo_db:
    container_name: algo_db
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ab45cd12
      - POSTGRES_DB=algo
      - POSTGRES_INITDB_ARGS=--data-checksums --encoding=UTF8 --locale=C
      - TZ=Asia/Kolkata
      - PGTZ=Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # postgres.conf stays the hand-maintained base; the settings that MUST track
    # the host's size are injected here instead, because command-line -c flags
    # override the config file. List form (not a string) so no shell splitting
    # is involved. Values come from .env, written by deploy.sh from the real
    # host specs — the defaults below are a safe 4GB/2-core fallback so this
    # file still works if .env is missing.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-2GB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINT_WORK_MEM:-256MB}
      - -c
      - max_worker_processes=${PG_MAX_WORKERS:-2}
      - -c
      - max_parallel_workers=${PG_MAX_PARALLEL:-2}
      - -c
      - max_parallel_workers_per_gather=${PG_PARALLEL_PER_GATHER:-1}
      - -c
      - max_parallel_maintenance_workers=${PG_PARALLEL_MAINT:-1}
      - -c
      - autovacuum_max_workers=${PG_AUTOVACUUM_WORKERS:-2}
    restart: always
    # /dev/shm must cover shared_buffers (parallel workers use it too); Docker's
    # 64MB default is far too small for Postgres.
    shm_size: ${DB_SHM:-1280m}
    # No deploy.resources.limits: the container can use all host CPU and RAM.
    sysctls:
      - net.core.somaxconn=4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    healthcheck:
      # Was only checking 'algo' - none of the 5 databases actually created for the trading
      # services (see initdb/*.sql: trading_db, finvasia, mano_trading_db, kotak_neo, angel_one)
      # were checked at all, so a per-database problem in any of those (e.g. that DB's own
      # corruption, or a role/permission issue scoped to it) wouldn't flip this container's health
      # status even though a dependent service would be failing against it right now.
      test: ["CMD-SHELL", "pg_isready -U postgres && for db in algo trading_db finvasia mano_trading_db kotak_neo angel_one; do psql -U postgres -d \"$$db\" -c 'SELECT 1' >/dev/null || exit 1; done"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
